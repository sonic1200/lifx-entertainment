[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=62.3"]

[project]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Pure asyncio + stdlib: the LIFX LAN protocol is plain UDP, no crypto or bridge needed.
dependencies = []
description = "Async Python client for streaming music-reactive colours to LIFX lights over the LAN protocol."
authors = [{name = "Nicolas Mivielle"}]
license = {text = "Apache-2.0"}
name = "lifx-entertainment"
readme = "README.md"
requires-python = ">=3.11"
# The version is set by a GH action on release.
version = "0.0.0"

[project.optional-dependencies]
test = [
  "codespell==2.4.2",
  "mypy==2.1.0",
  "pre-commit==4.6.0",
  "pre-commit-hooks==6.0.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.16",
]

[project.urls]
"Bug Reports" = "https://github.com/sonic1200/lifx-entertainment/issues"
"Source Code" = "https://github.com/sonic1200/lifx-entertainment"

[tool.setuptools]
include-package-data = true
platforms = ["any"]
zip-safe = false

[tool.setuptools.package-data]
lifx_entertainment = ["py.typed"]

[tool.setuptools.packages.find]
include = ["lifx_entertainment*"]

[tool.ruff]
fix = true
show-fixes = true

line-length = 100
target-version = "py311"

[tool.ruff.lint.pydocstyle]
# Sphinx-style docstrings with :param: syntax; pep257 is the base convention.
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 25
max-returns = 15
max-statements = 50

[tool.mypy]
platform = "linux"
python_version = "3.11"

follow_imports = "normal"
ignore_missing_imports = true

# be strict
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
  "ANN002", # Just annoying, not really useful
  "ANN003", # Just annoying, not really useful
  "ANN401", # Opinioated warning on disallowing dynamically typed expressions
  "A003", # Intentional: dataclass `id` field
  "D203", # Conflicts with other rules
  "D213", # Conflicts with other rules
  "D417", # False positives in some occasions
  "EM101", # Just annoying, not really useful
  "FIX002", # Just annoying, not really useful
  "PLR2004", # Just annoying, not really useful
  "PD011", # Just annoying, not really useful
  "S101", # assert is often used to satisfy type checking
  "TD002", # Just annoying, not really useful
  "TD003", # Just annoying, not really useful
  "TD004", # Just annoying, not really useful
  "TRY003", # Just annoying, not really useful
  "COM812", # Conflicts with the Ruff formatter
  "ISC001", # Conflicts with the Ruff formatter
  "FBT001", # Very opniated and not useful
  "FBT002", # idem (boolean defaults)
  "ASYNC109", # `timeout` is a deliberate part of the public API
  "ERA001", # False positives on byte-layout / documentation comments
  "TC001", # With `from __future__ import annotations`, runtime import cost is nil
  "TC002", # idem (third-party typing-only imports)
  "TC003", # idem (stdlib typing-only imports)
  "BLE001", # Broad excepts are deliberate at device/network boundaries
  "CPY001", # No per-file copyright headers (see LICENSE)
]

select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately poke at private members and use magic values.
"tests/*" = ["SLF001", "PLR2004", "ANN001", "ANN201", "D101", "D102", "D103", "D105", "D107", "INP001"]
# The provider follows Music Assistant's provider conventions, not a standalone package's.
"music_assistant_provider/*" = ["TRY300", "TRY400", "INP001", "PLR0913", "N999", "ARG002", "FBT003", "PERF401"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["lifx_entertainment", "music_assistant"]

[tool.ruff.lint.mccabe]
max-complexity = 25
